name: neural_sbi_python
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  
  # Core scientific computing
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - pyyaml
  
  # Neural SBI and deep learning
  - pip:
      - sbi>=0.22.0
      - pyro-ppl>=1.8.0
      - torch>=2.0.0
      - tensorboard>=2.0.0
      - pyDOE2>=1.3.0
